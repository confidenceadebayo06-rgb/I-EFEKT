<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I-EFEKT Circles</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#05060a;color:#f8fafc;font-family:system-ui} .panel{background:#101522;border:1px solid #263044;border-radius:16px}input,textarea,select{background:#080c15;border:1px solid #344054;border-radius:9px;padding:10px;width:100%;color:white}button{border-radius:9px;padding:9px 13px;font-weight:700}</style></head>
<body class="min-h-screen p-4"><main class="max-w-4xl mx-auto space-y-5"><header><a href="/">← Back to I-EFEKT</a><h1 class="text-3xl font-bold">Intentional Circles</h1><p>Small communities for shared goals and progress.</p></header><p id="status" role="status"></p>
<section class="panel p-4"><h2 class="font-bold text-xl mb-3">Create a Circle</h2><form id="create" class="grid md:grid-cols-2 gap-3"><input id="name" required maxlength="80" placeholder="Circle name"><input id="category" maxlength="40" placeholder="Category"><textarea id="description" maxlength="1000" placeholder="Description"></textarea><textarea id="purpose" maxlength="500" placeholder="Shared purpose"></textarea><select id="visibility"><option value="DISCOVERABLE">Discoverable</option><option value="PRIVATE">Private</option><option value="INVITE_ONLY">Invite only</option></select><select id="joinPolicy"><option value="APPROVAL">Owner approval required</option><option value="OPEN">Anyone can join</option></select><input id="maxMembers" type="number" min="2" max="50" value="12"><textarea id="rules" maxlength="2000" placeholder="Rules"></textarea><button class="bg-cyan-300 text-black md:col-span-2">Create Circle</button></form></section>
<section><h2 class="text-xl font-bold mb-3">Circles</h2><div id="circles" class="grid md:grid-cols-2 gap-3">Loading…</div></section></main>
<script>
const el=id=>document.getElementById(id);const say=s=>el('status').textContent=s||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed. Please sign in.');return d}
async function load(){try{const d=await api('/api/circles');const list=d.circles||[];el('circles').innerHTML='';if(!list.length)el('circles').textContent='No Circles found.';for(const c of list){const card=document.createElement('article');card.className='panel p-4 space-y-3';card.innerHTML='<h3 class="font-bold text-lg">'+esc(c.name)+'</h3><p>'+esc(c.description||c.purpose||'')+'</p><p class="text-xs">'+(c.joinPolicy==='APPROVAL'?'Approval required':'Open join')+' · '+esc(c.category)+'</p><div class="actions"></div><div class="pending"></div>';el('circles').appendChild(card);await actions(c,card)}}catch(e){say(e.message)}}
async function actions(c,card){try{const d=await api('/api/circles/'+encodeURIComponent(c.id));const m=d.membership;const a=card.querySelector('.actions');if(m&&m.status==='ACTIVE'){a.textContent='You are a member';if(m.role==='OWNER'||m.role==='FACILITATOR')await pending(c,card)}else if(m&&m.status==='PENDING'){a.textContent='Join request pending'}else{const b=document.createElement('button');b.textContent='Request to join';b.className='bg-cyan-300 text-black';b.onclick=()=>join(c.id);a.appendChild(b)}}catch(e){card.querySelector('.actions').textContent=e.message}}
async function pending(c,card){if(c.joinPolicy!=='APPROVAL')return;const box=card.querySelector('.pending');try{const d=await api('/api/circles/'+encodeURIComponent(c.id)+'/pending');const req=d.requests||[];box.innerHTML='<hr><h4 class="font-semibold">Pending join requests ('+req.length+')</h4>';for(const r of req){const row=document.createElement('div');row.className='flex justify-between gap-2 p-2';row.textContent=(r.user.displayName||r.user.handle)+' @'+r.user.handle;const b=document.createElement('button');b.textContent='Approve';b.className='bg-cyan-300 text-black';b.onclick=()=>approve(c.id,r.user.id);row.appendChild(b);box.appendChild(row)}}catch(e){box.textContent=e.message}}
async function join(id){try{const d=await api('/api/circles/'+encodeURIComponent(id)+'/join',{method:'POST',body:'{}'});say(d.message);await load()}catch(e){say(e.message)}}async function approve(id,user){try{await api('/api/circles/'+encodeURIComponent(id)+'/members/'+encodeURIComponent(user)+'/approve',{method:'POST',body:'{}'});say('Request approved.');await load()}catch(e){say(e.message)}}
el('create').addEventListener('submit',async e=>{e.preventDefault();const data={name:el('name').value,category:el('category').value||'GENERAL',description:el('description').value,purpose:el('purpose').value,visibility:el('visibility').value,joinPolicy:el('joinPolicy').value,maxMembers:Number(el('maxMembers').value),rules:el('rules').value};try{await api('/api/circles',{method:'POST',body:JSON.stringify(data)});e.target.reset();say('Circle created.');await load()}catch(err){say(err.message)}});load();
</script></body></html>
