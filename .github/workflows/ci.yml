name: I-EFEKT CI
# Run the same validation for stacked feature branches and their pull requests.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: iefekt_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/iefekt_ci
      JWT_SECRET: ci-only-secret-not-for-production
      NODE_ENV: test
      PORT: 3000
      REDIS_URL: redis://127.0.0.1:6379
      BACKUP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply schema to CI MySQL
        run: npx prisma db push
      - name: Install MariaDB client tools for backup/restore smoke test
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Build TypeScript and C++ ranking engine
        run: npm run build
      - name: Verify encrypted MySQL backup and isolated restore
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/iefekt-backups"
          mariadb --host 127.0.0.1 --port 3306 --user root --password=ci-root-password iefekt_ci --execute "CREATE TABLE BackupSmokeCheck (id INT PRIMARY KEY, marker VARCHAR(40) NOT NULL); INSERT INTO BackupSmokeCheck VALUES (1, 'restore-ok');"
          BACKUP_OUTPUT_DIR="$RUNNER_TEMP/iefekt-backups" node scripts/backup-mysql.mjs --local-only > "$RUNNER_TEMP/backup-result.json"
          BACKUP_FILE="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).file)" "$RUNNER_TEMP/backup-result.json")"
          node scripts/restore-backup-smoke.mjs "$BACKUP_FILE"
      - name: Start API for HTTP security contract tests
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/iefekt-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/iefekt-api.pid"
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /dev/null; then
              echo "I-EFEKT API is ready for security tests"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/iefekt-api.log"
          exit 1
      - name: Run security contract tests
        run: npm run test:security
      - name: Validate existing PWA inline JavaScript
        run: node tests/security/check-public-inline-scripts.mjs
      - name: Confirm Phase 1 session models are generated
        run: node -e "const p = require('./node_modules/.prisma/client'); if (!p.Prisma) process.exit(1); console.log('Prisma client generated')"
