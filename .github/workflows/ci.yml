name: I-EFEKT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: iefekt_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/iefekt_ci
      JWT_SECRET: ci-only-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run Circle concurrency tests
        run: npm test
      - name: Create baseline schema from main
        run: |
          git show origin/main:prisma/schema.prisma > /tmp/schema-base.prisma
          npx prisma db push --schema=/tmp/schema-base.prisma --skip-generate
      - name: Mark existing schema baseline as applied
        run: npx prisma migrate resolve --applied 20261117000000_baseline
      - name: Apply Circle migrations to CI MySQL
        run: npx prisma migrate deploy
      - name: Verify migration state
        run: npx prisma migrate status
      - name: Build TypeScript and C++ ranking engine
        run: npm run build
