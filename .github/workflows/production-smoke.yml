name: I-EFEKT production smoke check

on:
  workflow_run:
    workflows: ["I-EFEKT CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iefekt-production-smoke
  cancel-in-progress: true

jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check production API health
        env:
          HEALTH_URL: https://iefekt-app-production.up.railway.app/api/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 15 "$HEALTH_URL" || true)"
            if [ "$code" = "200" ]; then
              echo "Production health endpoint returned HTTP 200."
              cat /tmp/health.json
              exit 0
            fi
            echo "Health check attempt $attempt/12 returned HTTP ${code:-no response}; retrying in 10 seconds."
            sleep 10
          done
          echo "Production health check failed after 12 attempts."
          [ ! -f /tmp/health.json ] || cat /tmp/health.json
          exit 1
